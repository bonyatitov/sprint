# Reverse-proxy на хосте ВПС перед Docker-контейнером приложения.
# Контейнер публикует порт 8080 на localhost (см. docker-compose.yml) —
# этот конфиг открывает домен наружу и проксирует запросы туда.
#
# Установка:
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/sprint.bonya-dev.ru
#   sudo ln -s /etc/nginx/sites-available/sprint.bonya-dev.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS выпускается и дописывается в этот файл автоматически командой
# certbot (см. README.md, раздел «Домен и HTTPS»).

server {
    listen 80;
    server_name sprint.bonya-dev.ru;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
