server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Static assets are content-hashed by Vite, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routing (react-router): any unknown path falls back to
    # index.html so /notes still resolves after a hard reload or deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
